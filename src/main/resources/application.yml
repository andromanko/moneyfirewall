server:
  port: 8090

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_FINTRACTION_HOST:localhost}:${POSTGRES_FINTRACTION_PORT:5432}/${POSTGRES_FINTRACTION_DB:fin-bot-db}
    username: ${POSTGRES_FINTRACTION_USER:moneyfirewall}
    password: ${POSTGRES_FINTRACTION_PASSWORD:abezyany_TUT_niprichEM!!!-)))}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: ${TZ:Europe/Minsk}
        format_sql: false
  flyway:
    enabled: true

moneyfirewall:
  telegram:
    token: ${TELEGRAM_FINTRACTION_BOT_TOKEN:}
    username: ${TELEGRAM_FINTRACTION_BOT_USERNAME:moneyfirewall_bot}
  google:
    serviceAccountJson: ${GOOGLE_SERVICE_ACCOUNT_JSON:}
    spreadsheetPrefix: ${GOOGLE_SHEETS_PREFIX:MoneyFirewall}
  rates:
    savings:
      priceUrl: ${SAVINGS_RATE_PRICE_URL:https://api-adapter.dzengi.com/api/v2/ticker/24hr?symbol={symbol}}
      symbol: ${SAVINGS_RATE_SYMBOL:{base}/{quote}}
      priceField: ${SAVINGS_RATE_PRICE_FIELD:lastPrice}
      quoteCurrency: ${SAVINGS_RATE_QUOTE_CURRENCY:USD}

logging:
  level:
    root: INFO
    com.moneyfirewall.importing: DEBUG
    com.moneyfirewall.service: DEBUG
    com.moneyfirewall.telegram: DEBUG

